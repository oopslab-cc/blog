version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Seoul
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    reviewers:
      - no-01771
    groups:
      astro:
        patterns:
          - astro
          - "@astrojs/*"
        update-types:
          - minor
          - patch
      tailwind:
        patterns:
          - tailwindcss
          - "@tailwindcss/*"
        update-types:
          - minor
          - patch
      dev-minor:
        dependency-type: development
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: "chore(ci)"
    groups:
      actions:
        patterns:
          - "*"
