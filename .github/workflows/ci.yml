name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: check + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Diagnostics (astro check)
        run: pnpm check

      - name: Format check
        run: pnpm format:check

      - name: Build
        run: pnpm build

      - name: Generated SEO/AEO files
        run: |
          set -eu
          for f in dist/robots.txt dist/rss.xml dist/llms.txt dist/sitemap-index.xml; do
            test -s "$f" || { echo "missing or empty: $f"; exit 1; }
          done
